[versions]
java = "21"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"

[libraries]
# Versions are omitted on purpose: the Spring Boot BOM (applied by the
# io.spring.dependency-management plugin) manages them.
#
# Spring Boot 4 moved auto-configuration out of spring-boot-autoconfigure into
# per-technology modules. Depending on a raw library artifact (e.g.
# org.springframework.kafka:spring-kafka or org.flywaydb:flyway-core) gives you the
# library but NOT its auto-configuration - always reach for the starter.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Jackson 3 (tools.jackson.*, JsonMapper). Comes in transitively via starter-web, but
# declared explicitly because service code injects JsonMapper directly.
# Do NOT add com.fasterxml.jackson:* - that is Jackson 2 and would mean two JSON stacks.
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }

# Flyway 10+ ships database support in separate artifacts; PostgreSQL needs this one.
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-kafka-test = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
